name: foliate-personal
grade: stable
adopt-info: foliate
license: GPL-3.0+
base: core24
confinement: strict
compression: lzo
platforms:
  amd64:
  arm64:
  armhf:
layout:
  /usr/lib/$CRAFT_ARCH_TRIPLET/webkitgtk-6.0:
    bind: $SNAP/webkitgtk-platform/usr/lib/$CRAFT_ARCH_TRIPLET/webkitgtk-6.0
slots:
  foliate-personal:
    interface: dbus
    bus: session
    name: io.github.misakisata.Foliate
plugs:
  webkitgtk-6-gnome-2404:
    interface: content
    target: $SNAP/webkitgtk-platform
    default-provider: webkitgtk-6-gnome-2404
apps:
  foliate-personal:
    command: usr/bin/foliate-personal
    extensions:
      - gnome
    plugs:
      - home
      - removable-media
      - network
      - network-status
      - unity7
      - audio-playback
    desktop: usr/share/applications/io.github.misakisata.Foliate.desktop
    common-id: io.github.misakisata.Foliate
    environment:
      SPEECHD_ADDRESS: "unix_socket:/run/user/$SNAP_UID/speech-dispatcher/speechd.sock"
      LD_LIBRARY_PATH: $SNAP/webkitgtk-platform/usr/lib:$SNAP/webkitgtk-platform/usr/lib/$CRAFT_ARCH_TRIPLET:$LD_LIBRARY_PATH
      GI_TYPELIB_PATH: $SNAP/gnome-platform/usr/lib/$CRAFT_ARCH_TRIPLET/girepository-1.0:$SNAP/gnome-platform/usr/lib/$CRAFT_ARCH_TRIPLET/gjs/girepository-1.0:$SNAP/webkitgtk-platform/usr/lib/$CRAFT_ARCH_TRIPLET/girepository-1.0
parts:
  foliate:
    plugin: meson
    source: .
    build-environment:
      - PKG_CONFIG_PATH: /snap/webkitgtk-6-gnome-2404-sdk/current/usr/lib/$CRAFT_ARCH_TRIPLET/pkgconfig:$PKG_CONFIG_PATH
    meson-parameters:
      - --prefix=/snap/foliate-personal/current/usr
    override-pull: |
      craftctl default
      sed -i '1c#!/snap/foliate-personal/current/gnome-platform/usr/bin/gjs -m' src/main.js
    build-packages:
      - xmlstarlet
    build-snaps:
      - webkitgtk-6-gnome-2404-sdk/latest/stable
    parse-info:
      - usr/share/metainfo/io.github.misakisata.Foliate.metainfo.xml
    organize:
      snap/foliate-personal/current/usr: usr
  deps:
    plugin: nil
    stage-packages:
      - libspeechd2 # probably necessary, need testing
    prime:
      - usr/lib/*/libspeechd.so.*
